const secBox = document.getElementById('sections');
const ORDER = ["Furniture & big stuff","Electronics","Kitchen","Art & books","Home decor & more","Little things","Clothing & accessories"];
const sections = ORDER.filter(s=>ITEMS.some(i=>i.s===s)).concat([...new Set(ITEMS.map(i=>i.s))].filter(s=>!ORDER.includes(s)));
sections.forEach(s=>{
  const h = document.createElement('h2'); h.textContent = s; secBox.appendChild(h);
  const g = document.createElement('div'); g.className='grid'; secBox.appendChild(g);
  ITEMS.filter(i=>i.s===s).forEach(item=>{
    const card = document.createElement('div'); card.className='card';
    let phHtml;
    if (item.ph.length) {
      const more = item.ph.length>1 ? `<span class="more">${item.ph.length} 📷</span>` : '';
      phHtml = `<div class="ph${item.fit==='contain'?' contain':''}"><img src="img/${item.ph[0]}.jpeg" alt="" loading="lazy">${more}</div>`;
    } else {
      phHtml = `<div class="noimg">📷 photo soon</div>`;
    }
    card.innerHTML = `${phHtml}<div class="info"><div class="name">${item.n}</div><div class="price">${item.p}</div><div class="note">${item.note}</div></div>`;
    card.addEventListener('click',()=>openModal(item));
    g.appendChild(card);
  });
});

// modal
const ov=document.getElementById('ov'), mimg=document.getElementById('mimg'),
      mthumbs=document.getElementById('mthumbs'), mname=document.getElementById('mname'),
      mprice=document.getElementById('mprice'), mdetails=document.getElementById('mdetails'),
      prev=document.getElementById('prev'), next=document.getElementById('next');
let cur=null, idx=0;
function openModal(item){
  cur=item; idx=0;
  mname.textContent=item.n; mprice.textContent=item.p; mdetails.textContent=item.d;
  mthumbs.innerHTML='';
  if(item.ph.length){
    item.ph.forEach((p,i)=>{
      const t=document.createElement('img'); t.src=`img/${p}.jpeg`;
      t.addEventListener('click',e=>{e.stopPropagation(); show(i);});
      mthumbs.appendChild(t);
    });
    show(0);
    document.getElementById('mstage').style.display='';
    mthumbs.style.display = item.ph.length>1 ? 'flex' : 'none';
    prev.style.display=next.style.display = item.ph.length>1 ? '' : 'none';
  } else {
    document.getElementById('mstage').style.display='none';
    mthumbs.style.display='none';
  }
  ov.classList.add('open'); document.body.style.overflow='hidden';
}
function show(i){
  idx=(i+cur.ph.length)%cur.ph.length;
  mimg.src=`img/${cur.ph[idx]}.jpeg`;
  [...mthumbs.children].forEach((t,j)=>t.classList.toggle('on',j===idx));
}
prev.addEventListener('click',e=>{e.stopPropagation(); show(idx-1);});
next.addEventListener('click',e=>{e.stopPropagation(); show(idx+1);});
function closeModal(){ ov.classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('mclose').addEventListener('click',closeModal);
ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
document.addEventListener('keydown',e=>{
  if(!ov.classList.contains('open')) return;
  if(e.key==='Escape') closeModal();
  if(e.key==='ArrowLeft'&&cur&&cur.ph.length>1) show(idx-1);
  if(e.key==='ArrowRight'&&cur&&cur.ph.length>1) show(idx+1);
});
</script>
